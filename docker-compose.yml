version: '3.8'

services:
  # 1. Authentication Microservice (:8001)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: student-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET_KEY=supersecretjwtkey_change_in_production_min32chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - AUTH_SERVICE_PORT=8001
      - AUTH_DATABASE_URL=sqlite:////app/data/auth.db
    volumes:
      - auth-data:/app/data
    networks:
      - student-network

  # 2. Student Microservice (:8002)
  student-service:
    build:
      context: ./student-service
      dockerfile: Dockerfile
    container_name: student-student-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - JWT_SECRET_KEY=supersecretjwtkey_change_in_production_min32chars
      - JWT_ALGORITHM=HS256
      - STUDENT_SERVICE_PORT=8002
      - STUDENT_DATABASE_URL=sqlite:////app/data/students.db
    volumes:
      - student-data:/app/data
    networks:
      - student-network

  # 3. Course Microservice (:8003)
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: student-course-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - JWT_SECRET_KEY=supersecretjwtkey_change_in_production_min32chars
      - JWT_ALGORITHM=HS256
      - COURSE_SERVICE_PORT=8003
      - STUDENT_SERVICE_URL=http://student-service:8002
      - COURSE_DATABASE_URL=sqlite:////app/data/courses.db
    volumes:
      - course-data:/app/data
    depends_on:
      - student-service
    networks:
      - student-network

  # 4. Central API Gateway (:8000)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: student-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - STUDENT_SERVICE_URL=http://student-service:8002
      - COURSE_SERVICE_URL=http://course-service:8003
    depends_on:
      - auth-service
      - student-service
      - course-service
    networks:
      - student-network

  # 5. React Frontend (:5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api-gateway
    networks:
      - student-network

volumes:
  auth-data:
    driver: local
  student-data:
    driver: local
  course-data:
    driver: local

networks:
  student-network:
    driver: bridge
